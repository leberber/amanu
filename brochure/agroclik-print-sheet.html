<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>AgroClik - Print Sheet 2m x 1m</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
      background: #1E293B;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    @page {
      size: 2000mm 1000mm;
      margin: 0;
    }

    @media print {
      body { background: white; padding: 0; }
      .info { display: none !important; }
      .sheet { box-shadow: none; margin: 0; }
    }

    .info {
      max-width: 1200px; width: 100%;
      background: #0F172A; color: #CBD5E1;
      padding: 14px 20px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; margin-bottom: 15px;
    }
    .info h2 { color: #7DD3A0; font-size: 16px; margin-bottom: 4px; }
    .info strong { color: #93C5FD; }

    /* 2000mm x 1000mm → 1200px x 600px on screen */
    .sheet {
      width: 1200px;
      height: 600px;
      background: white;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      padding: 4px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 4px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.5px dashed #CBD5E1;
      border-radius: 3px;
      overflow: hidden;
    }

    /* Logo + tagline combo */
    .logo-combo {
      flex-direction: column;
      gap: 8px;
      padding: 10px;
    }

    .logo-combo img {
      object-fit: contain;
    }

    .logo-combo .tag {
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="info">
    <h2>Feuille d'impression 2m x 1m — AgroClik</h2>
    <p>
      <strong>Dimensions :</strong> 200cm x 100cm.<br>
      <strong>Exportez en PDF</strong> (Ctrl+P) et envoyez a l'imprimeur.
    </p>
  </div>

  <div class="sheet">

    <!-- Logo + Restock with a Click -->
    <div class="item logo-combo" style="width:300px;height:290px;">
      <img src="../frontend/public/apple-touch-icon.png" alt="A" style="width:180px;height:180px;" />
      <div class="tag" style="font-size:16px;letter-spacing:4px;">Restock with a Click</div>
    </div>

  </div>

</body>
</html>
