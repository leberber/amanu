<!-- Page Layout - Consistent structure for all pages -->
<div class="page-layout" [class.page-layout--fullscreen]="fullscreen()">

  <!-- Top Bar - Back button and page title -->
  <header class="page-topbar">
    <!-- Left: Back button -->
    <div class="page-topbar__left">
      @if (showBackButton()) {
        <app-back-button
          [route]="backRoute()"
          [showLabel]="false"
          
          class="page-topbar__back">
        </app-back-button>
      }
    </div>

    <!-- Center: Title (absolutely centered) -->
    <div class="page-topbar__center">
      <ng-content select="[pageHeader]"></ng-content>
      @if (title()) {
        <h1 class="page-topbar__title">{{ title() | translate }}</h1>
      }
    </div>

    <!-- Right: Actions -->
    <div class="page-topbar__right">
      <ng-content select="[pageActions]"></ng-content>
    </div>
  </header>

  <!-- Scrollable Content Area -->
  <main class="page-content">
    <ng-content></ng-content>
  </main>

</div>
