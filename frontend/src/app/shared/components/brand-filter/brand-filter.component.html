<div class="brand-filter">
  <!-- All Brands Option -->
  @if (showAllOption()) {
    <div
      #brandItem
      class="brand-item"
      [class.active]="isActive(null)"
      (click)="selectBrand(null)">
      <div class="brand-image-wrapper">
        <div class="brand-image toggle-button">
          <i class="pi pi-building"></i>
        </div>
      </div>
      <span class="brand-name">{{ allLabel() | translate }}</span>
    </div>
  }

  <!-- Individual Brands -->
  @for (brand of brands(); track brand.id) {
    <div
      #brandItem
      class="brand-item"
      [class.active]="isActive(brand.id)"
      (click)="selectBrand(brand.id)">
      <div class="brand-image-wrapper">
        @if (brand.logo_url) {
          <img
            [src]="brand.logo_url"
            [alt]="brand.name"
            class="brand-image">
        } @else {
          <div class="brand-image toggle-button">
            <i class="pi pi-building"></i>
          </div>
        }
      </div>
      <span class="brand-name">{{ brand.name }}</span>
    </div>
  }

  <!-- Sliding Indicator -->
  <div
    class="brand-indicator"
    [style.left.px]="indicatorLeft()"
    [style.width.px]="indicatorWidth()">
  </div>

  <!-- Search Toggle Button -->
  @if (showSearchIcon()) {
    <div
      class="search-toggle-btn"
      [class.active]="isSearchOpen()"
      (click)="toggleSearch()">
      @if (!isSearchOpen()) {
        <i class="pi pi-search"></i>
      } @else {
        <i class="pi pi-times"></i>
      }
    </div>
  }

  <!-- Loading state -->
  @if (loading()) {
    <div class="loading">
      <i class="pi pi-spin pi-spinner"></i>
    </div>
  }
</div>
