<div class="category-bar" [class.compact]="compact()">
  <!-- All Categories Option -->
  @if (showAllOption()) {
    <div
      #categoryItem
      class="category-item"
      [class.active]="isActive(null)"
      (click)="selectCategory(null)">
      <div class="category-image-wrapper">
        <div class="category-image all-categories">
          <i class="pi pi-th-large"></i>
        </div>
      </div>
      <span class="category-name">{{ allLabel() | translate }}</span>
    </div>
  }

  <!-- Individual Categories -->
  @for (category of categories(); track category.id) {
    <div
      #categoryItem
      class="category-item"
      [class.active]="isActive(category.id)"
      (click)="selectCategory(category.id)">
      <div class="category-image-wrapper">
        <img
          [src]="category.image_url || 'assets/images/category-placeholder.jpg'"
          [alt]="category.name"
          class="category-image">
        @if (category.product_count) {
          <span class="category-count">{{ category.product_count }}</span>
        }
      </div>
      <span class="category-name">{{ category.name }}</span>
    </div>
  }

  <!-- Sliding Indicator -->
  <div
    class="category-indicator"
    [style.left.px]="indicatorLeft()"
    [style.width.px]="indicatorWidth()">
  </div>

  <!-- Search Toggle -->
  @if (showSearchIcon()) {
    <div
      class="search-toggle-btn"
      [class.active]="isSearchOpen()"
      (click)="toggleSearch()">
      @if (!isSearchOpen()) {
        <i class="pi pi-search"></i>
      } @else {
        <i class="pi pi-times"></i>
      }
    </div>
  }
</div>
