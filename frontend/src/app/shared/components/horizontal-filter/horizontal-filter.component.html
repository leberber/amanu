<div class="filter-bar" [class.compact]="compact()" [attr.data-filter-type]="filterType()">
  <!-- Mode Toggle -->
  @if (showModeToggle()) {
    <div
      class="filter-item mode-toggle"
      (click)="toggleMode()">
      <div class="toggle-circle">
        <img [src]="getToggleImage()" alt="" class="toggle-img">
      </div>
    </div>
  }

  <!-- All Option -->
  @if (showAllOption()) {
    <div
      #filterItem
      class="filter-item"
      [class.active]="isActive(null)"
      (click)="selectItem(null)">
      <div class="item-image-wrapper">
        <div class="item-image all-option">
          <i [class]="getIconClass()"></i>
        </div>
      </div>
      @if (showItemName()) {
        <span class="item-name">{{ allLabel() | translate }}</span>
      }
    </div>
  }

  <!-- Individual Items -->
  @for (item of items(); track item.id) {
    <div
      #filterItem
      class="filter-item"
      [class.active]="isActive(item.id)"
      (click)="selectItem(item.id)">
      <div class="item-image-wrapper">
        @if (getItemImage(item); as imageUrl) {
          <img
            [src]="imageUrl"
            [alt]="item.name"
            class="item-image"
            [style.transform]="'scale(' + getScale() + ')'">
        } @else {
          <div class="item-image placeholder">
            <i [class]="getIconClass()"></i>
          </div>
        }
      </div>
      @if (showItemName()) {
        <span class="item-name">{{ item.name }}</span>
      }
    </div>
  }

  <!-- Sliding Indicator -->
  <div
    class="filter-indicator"
    [style.left.px]="indicatorLeft()"
    [style.width.px]="indicatorWidth()">
  </div>

  <!-- Search Toggle -->
  @if (showSearchIcon()) {
    <div class="filter-actions">
      <button
        class="search-toggle-btn"
        [class.active]="isSearchActive()"
        (click)="toggleSearch()">
        <i class="pi pi-search"></i>
      </button>
    </div>
  }
</div>
