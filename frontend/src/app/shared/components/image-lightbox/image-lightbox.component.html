@if (imageUrl(); as url) {
  <div class="image-lightbox" (click)="onBackdropClick()">
    <div class="lightbox-bg">
      <div class="lightbox-blob lightbox-blob-1"></div>
      <div class="lightbox-blob lightbox-blob-2"></div>
      <div class="lightbox-blob lightbox-blob-3"></div>
    </div>
    <button class="lightbox-close" (click)="onClose()">
      <i class="pi pi-times"></i>
    </button>
    <img [src]="url" [alt]="altText()" (click)="onImageClick($event)">
  </div>
}
