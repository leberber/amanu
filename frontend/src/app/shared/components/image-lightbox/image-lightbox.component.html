@if (imageUrl(); as url) {
  <div class="lightbox" (click)="onBackdropClick()">
    <button class="lightbox__close" (click)="onClose()">
      <i class="pi pi-times"></i>
    </button>

    <div class="lightbox__content" (click)="onContentClick($event)">
      <img [src]="url" [alt]="altText()" class="lightbox__image">

      @if (title() || details().length > 0) {
        <div class="lightbox__info">
          @if (title()) {
            <h3 class="lightbox__title">{{ title() }}</h3>
          }
          @if (details().length > 0) {
            <div class="lightbox__details">
              @for (detail of details(); track detail.label) {
                <div class="lightbox__detail">
                  <span class="lightbox__detail-label">{{ detail.label }}</span>
                  <span class="lightbox__detail-value">{{ detail.value }}</span>
                </div>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
}
