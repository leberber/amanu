<div class="empty-state" [class.empty-state--compact]="compact()">
  <div [class]="iconClass()">
    <i [class]="'pi ' + icon()"></i>
  </div>

  <h3 class="empty-state__title">{{ title() | translate }}</h3>

  @if (description(); as desc) {
    <p class="empty-state__description">{{ desc | translate }}</p>
  }

  @if (actionLabel(); as label) {
    <div class="state-actions">
      @if (actionLink()) {
        <a [routerLink]="actionLink()" class="state-action-btn state-action-btn--primary">
          <i [class]="actionIcon()"></i>
          <span>{{ label | translate }}</span>
        </a>
      } @else {
        <button (click)="onActionClick()" class="state-action-btn state-action-btn--primary">
          <i [class]="actionIcon()"></i>
          <span>{{ label | translate }}</span>
        </button>
      }
    </div>
  }

  <ng-content />
</div>
