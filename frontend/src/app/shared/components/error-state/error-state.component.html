<div class="error-state">
  <div class="error-icon-wrapper">
    <div class="error-icon-bg"></div>
    <div class="error-icon-circle">
      <i class="pi pi-exclamation-triangle"></i>
    </div>
  </div>

  <h3>{{ title() | translate }}</h3>
  <p>{{ message() | translate }}</p>

  @if (showRetry() || showGoBack()) {
    <div class="error-actions">
      @if (showRetry()) {
        <button (click)="onRetry()" class="action-btn primary">
          <i class="pi pi-refresh"></i>
          <span>{{ 'common.try_again' | translate }}</span>
        </button>
      }
      @if (showGoBack()) {
        <button (click)="onGoBack()" class="action-btn secondary">
          <i class="pi pi-arrow-left"></i>
          <span>{{ 'common.go_back' | translate }}</span>
        </button>
      }
    </div>
  }

  @if (details()) {
    <details class="error-details">
      <summary>{{ 'common.technical_details' | translate }}</summary>
      <pre>{{ details() }}</pre>
    </details>
  }
</div>
