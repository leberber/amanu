<div class="empty-state">
  <div class="empty-state__icon empty-state__icon--danger">
    <i class="pi pi-exclamation-triangle"></i>
  </div>

  <h3 class="empty-state__title">{{ title() | translate }}</h3>
  <p class="empty-state__description">{{ message() | translate }}</p>

  @if (showRetry() || showGoBack()) {
    <div class="state-actions">
      @if (showRetry()) {
        <button (click)="onRetry()" class="state-action-btn state-action-btn--primary">
          <i class="pi pi-refresh"></i>
          <span>{{ 'common.try_again' | translate }}</span>
        </button>
      }
      @if (showGoBack()) {
        <button (click)="onGoBack()" class="state-action-btn state-action-btn--secondary">
          <i class="pi pi-arrow-left"></i>
          <span>{{ 'common.go_back' | translate }}</span>
        </button>
      }
    </div>
  }

  @if (details()) {
    <details class="error-details">
      <summary>{{ 'common.technical_details' | translate }}</summary>
      <pre>{{ details() }}</pre>
    </details>
  }
</div>
