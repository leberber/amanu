@if (loading()) {
  <div class="page">
    <div class="loading">
      <i class="pi pi-spin pi-spinner"></i>
    </div>
  </div>
} @else if (trip()) {
  <div class="page">
    <!-- Back Button -->
    <button class="back-btn" (click)="goBack()">
      <i class="pi pi-arrow-left"></i>
    </button>

    <!-- TEST BUTTON - click to manually resize map -->
    <button class="test-btn" (click)="shrinkMap()">
      SHRINK MAP (test)
    </button>

    <!-- DEBUG: shows current value -->
    <div class="debug-text">
      showFullScreenMap = {{ showFullScreenMap() }}
    </div>

    <!-- Map: fullscreen initially, 30vh after animation -->
    <div class="map" [style.height]="showFullScreenMap() ? '100vh' : '30vh'">
      @if (routeCoords().length >= 2) {
        <app-animated-route-map
          #mapComponent
          [routeCoords]="routeCoords()"
          [stops]="sortedStops()"
          [autoStart]="true"
          [animationDuration]="4000"
          (animationComplete)="onAnimationComplete()"
        />
      } @else {
        <div class="map__placeholder">
          <i class="pi pi-map"></i>
        </div>
      }
    </div>

    <!-- Content: shows after animation -->
    @if (!showFullScreenMap()) {
      <div class="content">
        <p>Content here - map is now 30vh</p>
      </div>
    }
  </div>
}
