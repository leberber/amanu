<div class="driver-layout">
  <!-- Floating Status Indicator -->
  <button
    class="driver-status-float"
    [style.--status-color]="statusColor()"
    [class.driver-status-float--clickable]="canToggleStatus()"
    (click)="canToggleStatus() && toggleStatus()">
    <span class="driver-status-float__dot"></span>
    <span class="driver-status-float__label">{{ statusLabel() | translate }}</span>
  </button>

  <!-- Main Content Area -->
  <main class="driver-content" @pageAnimation>
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation -->
  @if (!hideBottomNav()) {
    <nav class="driver-nav">
      @for (item of navItems; track item.path) {
        <a
          class="driver-nav__item"
          [routerLink]="item.path"
          routerLinkActive="driver-nav__item--active"
          [routerLinkActiveOptions]="{ exact: item.exact }">
          <span class="driver-nav__icon-wrap">
            <i [class]="item.icon"></i>
            @if (item.showBadge && activeOrdersCount() > 0) {
              <span class="driver-nav__badge">{{ activeOrdersCount() }}</span>
            }
          </span>
          <span class="driver-nav__label">{{ item.label | translate }}</span>
        </a>
      }
    </nav>
  }
</div>
