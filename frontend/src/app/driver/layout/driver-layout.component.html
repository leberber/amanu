<div class="driver-layout">
  <!-- Top Bar Header -->
  @if (!hideHeader()) {
    <header class="driver-header">
      <div class="driver-header__left">
        @if (showBackButton()) {
          <button class="back-btn" (click)="goBack()">
            <i class="pi pi-arrow-left"></i>
          </button>
        } @else {
          <h1 class="driver-header__title">{{ pageTitle() | translate }}</h1>
        }
      </div>

      <div class="driver-header__right">
        <!-- Status Badge -->
        <button
          class="status-badge"
          [style.--status-color]="statusColor()"
          [class.status-badge--clickable]="canToggleStatus()"
          (click)="canToggleStatus() && toggleStatus()">
          <span class="status-badge__dot"></span>
          <span class="status-badge__label">{{ statusLabel() | translate }}</span>
        </button>
      </div>
    </header>
  }

  <!-- Main Content Area -->
  <main
    class="driver-content"
    [class.driver-content--no-header]="hideHeader()"
    [class.driver-content--no-nav]="hideBottomNav()">
    <div class="route-animation-wrapper" [@driverRouteAnimation]="animationState()">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Bottom Navigation -->
  @if (!hideBottomNav()) {
    <nav class="driver-nav">
      @for (item of navItems; track item.path) {
        <a
          class="driver-nav__item"
          [routerLink]="item.path"
          routerLinkActive="driver-nav__item--active"
          [routerLinkActiveOptions]="{ exact: item.exact }">
          <span class="driver-nav__icon-wrap">
            <i [class]="item.icon"></i>
            @if (item.showBadge && activeOrdersCount() > 0) {
              <span class="driver-nav__badge">{{ activeOrdersCount() }}</span>
            }
          </span>
          <span class="driver-nav__label">{{ item.label | translate }}</span>
        </a>
      }
    </nav>
  }
</div>
