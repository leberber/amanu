<!-- Header Container -->
<div class="fixed top-0 left-0 w-full surface-card z-5 header-height pt-2">
  <div class="h-full px-2">
    
    <!-- Desktop Layout -->
    <div class="hidden lg:flex h-full justify-content-between align-items-center">
      <ng-container *ngTemplateOutlet="desktopLogo"></ng-container>
      <ng-container *ngTemplateOutlet="desktopActions"></ng-container>
    </div>

    <!-- Mobile Layout -->
    <div class="flex lg:hidden h-full justify-content-between align-items-center">
      <ng-container *ngTemplateOutlet="mobileLogo"></ng-container>
      <ng-container *ngTemplateOutlet="mobileActions"></ng-container>
    </div>
    
  </div>
</div>

<!-- Mobile Drawer -->
<p-drawer
  [(visible)]="menuVisible"
  position="full"
  [showCloseIcon]="false"
  [modal]="false"
  styleClass="mobile-drawer">

  <ng-template pTemplate="headless">
    <div class="drawer-container">
      <!-- Animated Background -->
      <div class="drawer-bg-decoration">
        <div class="drawer-blob drawer-blob-1"></div>
        <div class="drawer-blob drawer-blob-2"></div>
        <div class="drawer-blob drawer-blob-3"></div>
      </div>

      <ng-container *ngTemplateOutlet="drawerContent"></ng-container>
    </div>
  </ng-template>
</p-drawer>

<!-- ===================== TEMPLATE DEFINITIONS ===================== -->

<!-- Desktop Logo Template -->
<ng-template #desktopLogo>
  <div class="flex align-items-center">
    <!-- Temporarily removed home link
    <a routerLink="/" class="mr-4">
      <img src="/logo.png" alt="Elsuq" class="logo">
    </a>
    -->
    <img src="/logo.png" alt="Elsuq" class="logo mr-4">
    <p-menubar 
      [model]="items()" 
      styleClass="border-none bg-transparent">
    </p-menubar>
  </div>
</ng-template>

<!-- Desktop Actions Template -->
<ng-template #desktopActions>
  <div class="flex align-items-center gap-2">
    <a routerLink="/cart" class="flex align-items-center gap-1 text-color">
      <p-overlayBadge [value]="cartCount() || null" severity="danger">
        <i id="cart-icon" class="pi pi-shopping-cart text-xl"></i>
      </p-overlayBadge>
      <span class="ml-1">{{ 'common.cart' | translate }}</span>
    </a>
    
    <ng-container *ngIf="authService.isLoggedIn; else loginButtons">
      <ng-container *ngTemplateOutlet="userMenu"></ng-container>
    </ng-container>
    
    <ng-template #loginButtons>
      <a routerLink="/login" class="fancy-auth-btn primary">
        <span>{{ 'common.login' | translate }}</span>
        <div class="btn-icon">
          <i class="pi pi-sign-in"></i>
        </div>
      </a>
      <a routerLink="/register" class="fancy-auth-btn primary">
        <span>{{ 'common.register' | translate }}</span>
        <div class="btn-icon">
          <i class="pi pi-arrow-right"></i>
        </div>
      </a>
    </ng-template>
  </div>
</ng-template>

<!-- Mobile Logo Template -->
<ng-template #mobileLogo>
  <!-- Temporarily removed home link
  <a routerLink="/">
    <img src="/logo.png" alt="Elsuq" class="logo">
  </a>
  -->
  <img src="/logo.png" alt="Elsuq" class="logo">
</ng-template>

<!-- Mobile Actions Template -->
<ng-template #mobileActions>
  <div class="flex align-items-center gap-2">
    <a routerLink="/cart">
      <ng-container *ngIf="cartCount(); else emptyCartMobile">
        <p-overlayBadge [value]="cartCount()" severity="danger">
          <i id="cart-icon-mobile" class="pi pi-shopping-cart"></i>
        </p-overlayBadge>
      </ng-container>
      <ng-template #emptyCartMobile>
        <i id="cart-icon-mobile" class="pi pi-shopping-cart"></i>
      </ng-template>
    </a>
    
    <button 
      pButton 
      icon="pi pi-bars"
      class="p-button-text p-button-rounded "
      (click)="toggleMobileMenu()">
    </button>
  </div>
</ng-template>

<!-- User Menu Template -->
<ng-template #userMenu>
  <p-menu #menu [model]="userMenuItems()" [popup]="true">
    <ng-template pTemplate="start">
      <div class="p-3 border-bottom-1 surface-border">
        <app-language-selector></app-language-selector>
      </div>
    </ng-template>
  </p-menu>
  <button 
    type="button" 
    class="user-menu-btn flex align-items-center"
    (click)="menu.toggle($event)">
    <p-avatar 
      [label]="userInitials()" 
      shape="circle" 
      styleClass="user-avatar">
    </p-avatar>
  </button>
</ng-template>

<!-- Drawer Content Template -->
<ng-template #drawerContent>
  <div class="drawer-content">
    <!-- Drawer Header -->
    <div class="drawer-header">
      <img src="/logo.png" alt="Elsuq" class="drawer-logo">
      <div class="drawer-header-actions">
        <app-language-selector></app-language-selector>
        <a *ngIf="authService.isLoggedIn" routerLink="/account" class="drawer-profile-btn" (click)="closeMenu()">
          <i class="pi pi-user"></i>
        </a>
        <button class="drawer-close-btn" (click)="closeMenu()">
          <i class="pi pi-times"></i>
        </button>
      </div>
    </div>

    <!-- Navigation Items -->
    <div class="drawer-nav-section">
      <a
        *ngFor="let item of mobileItems()"
        [routerLink]="item.routerLink"
        (click)="closeMenu()"
        class="drawer-nav-item">
        <div class="nav-icon">
          <i [class]="item.icon"></i>
        </div>
        <span class="nav-label">{{ item.label }}</span>
        <i class="pi pi-chevron-right nav-arrow"></i>
      </a>
    </div>

    <!-- User Section - Only show login buttons when not logged in -->
    <div class="drawer-user-section" *ngIf="!authService.isLoggedIn">
      <ng-container *ngTemplateOutlet="mobileLoginSection"></ng-container>
    </div>

    <!-- Logout button when logged in -->
    <div class="drawer-logout-section" *ngIf="authService.isLoggedIn">
      <button class="logout-btn" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        <span>{{ 'common.logout' | translate }}</span>
      </button>
    </div>
  </div>
</ng-template>

<!-- Mobile Login Section Template -->
<ng-template #mobileLoginSection>
  <div class="drawer-card login-card">
    <div class="login-header">
      <div class="login-icon-wrapper">
        <div class="login-icon-bg"></div>
        <div class="login-icon-circle">
          <i class="pi pi-user"></i>
        </div>
      </div>
      <h3>{{ 'auth.welcome' | translate }}</h3>
      <p>{{ 'auth.signInMessage' | translate }}</p>
    </div>

    <div class="login-actions">
      <a routerLink="/login" class="mobile-auth-btn primary" (click)="closeMenu()">
        <span>{{ 'common.login' | translate }}</span>
        <div class="btn-icon">
          <i class="pi pi-sign-in"></i>
        </div>
      </a>
      <a routerLink="/register" class="mobile-auth-btn outlined" (click)="closeMenu()">
        <i class="pi pi-user-plus"></i>
        <span>{{ 'common.register' | translate }}</span>
      </a>
    </div>
  </div>
</ng-template>
