<!-- src/app/app.component.html -->
<div class="app-container flex h-screen overflow-hidden"
     [class.with-sidebar]="showNavigation() && !isMobile()"
     [class.with-bottom-nav]="showNavigation() && isMobile()">

  <!-- Decorative background blobs - visible through transparent components -->
  <div class="decorative-blob-container">
    <div class="decorative-blob decorative-blob--primary app-blob-primary"></div>
    <div class="decorative-blob decorative-blob--accent app-blob-accent"></div>
  </div>

  @if (showNavigation()) {
    <app-sidebar />
  }

  <main class="app-main flex-1 h-screen overflow-hidden flex flex-column">
    <router-outlet></router-outlet>
  </main>

  @if (showNavigation() && isMobile()) {
    <app-bottom-navigation />
  }

</div>
