<!-- Splash Screen -->
@if (showSplash()) {
  <div class="splash" [class.splash--exiting]="splashExiting()">
    <div class="splash__logo">
      <img src="/logo.png" alt="Logo">
    </div>
  </div>
}

<!-- src/app/app.component.html -->
<div class="app-container flex h-screen overflow-hidden"
     [class.with-sidebar]="showNavigation() && !isMobile()"
     [class.with-sidebar-collapsed]="showNavigation() && !isMobile() && sidebarCollapsed()"
     [class.with-bottom-nav]="showNavigation() && isMobile() && !hideBottomNav()">

  @if (showNavigation()) {
    <app-sidebar />
  }

  <main class="app-main flex-1 h-screen overflow-hidden flex flex-column">
    <div class="route-container" [@routeAnimation]="getRouteAnimationData()">
      <router-outlet></router-outlet>
    </div>
  </main>

  @if (showNavigation() && isMobile() && !hideBottomNav()) {
    <app-bottom-navigation />
  }

</div>

<!-- Inactive Account Modal -->
@if (showInactiveModal) {
  <div class="inactive-lightbox" (click)="showInactiveModal = false">
    <div class="inactive-lightbox__content" (click)="$event.stopPropagation()">
      <app-inactive-user-message
        buttonType="understood"
        (buttonClick)="showInactiveModal = false"
      />
    </div>
  </div>
}
