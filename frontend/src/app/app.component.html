<!-- src/app/app.component.html -->
<div class="app-layout" [class.with-sidebar]="showNavigation() && !isMobile()" [class.with-bottom-nav]="showNavigation() && isMobile()">

  <!-- Sidebar - renders fixed on desktop, drawer on mobile -->
  @if (showNavigation()) {
    <app-sidebar />
  }

  <!-- Main content area -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom navigation - Mobile only -->
  @if (showNavigation() && isMobile()) {
    <app-bottom-navigation />
  }

</div>
