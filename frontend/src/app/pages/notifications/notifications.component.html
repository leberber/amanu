<app-page-layout
  title="notifications_page.title"
  icon="pi pi-bell"
  [hideMobileIcon]="true"
  [showBackButton]="true"
  [backRoute]="routes.PRODUCTS"
  [fullscreen]="true">

  <div class="notifications-container">
    @if (loading()) {
      <div class="notifications-list">
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <div class="notification-card notification-card--skeleton">
            <div class="notification-card__icon">
              <div class="skeleton skeleton-icon"></div>
            </div>
            <div class="notification-card__content">
              <div class="skeleton" style="width: 60%; height: 18px; margin-bottom: 8px;"></div>
              <div class="skeleton" style="width: 90%; height: 14px; margin-bottom: 8px;"></div>
              <div class="skeleton" style="width: 100px; height: 12px;"></div>
            </div>
          </div>
        }
      </div>
    } @else if (error()) {
      <app-empty-state
        icon="pi-exclamation-triangle"
        iconVariant="danger"
        title="common.error"
        description="notifications_page.error_message"
        actionLabel="common.refresh"
        actionIcon="pi pi-refresh"
        (actionClick)="loadNotifications()" />
    } @else if (notifications().length === 0) {
      <app-empty-state
        icon="pi-bell-slash"
        title="notifications_page.empty_title"
        description="notifications_page.empty_message"
        actionLabel="notifications_page.browse_products"
        [actionLink]="routes.PRODUCTS"
        actionIcon="pi pi-shopping-bag" />
    } @else {
      <div class="notifications-list">
        @for (notif of notifications(); track notif.id) {
          <div
            class="notification-card"
            [class.notification-card--unread]="!notif.is_read"
            (click)="onNotificationClick(notif)">
            <div class="notification-card__icon notification-card__icon--{{ notif.type }}">
              <i [class]="getNotificationIcon(notif.type)"></i>
            </div>
            <div class="notification-card__content">
              <h4 class="notification-card__title">{{ notif.title }}</h4>
              <p class="notification-card__message">{{ notif.message }}</p>
              <span class="notification-card__date">
                {{ notif.created_at | date:'dd/MM/yyyy HH:mm' }}
              </span>
            </div>
            <div class="notification-card__actions">
              <button
                class="notification-card__delete"
                (click)="onDeleteClick($event, notif)"
                [attr.aria-label]="'common.delete' | translate">
                <i class="pi pi-times"></i>
              </button>
              <span class="notification-card__status" [class.notification-card__status--read]="notif.is_read">
                <i class="pi pi-check"></i>
                <i class="pi pi-check"></i>
              </span>
            </div>
          </div>
        }
      </div>
    }
  </div>
</app-page-layout>
