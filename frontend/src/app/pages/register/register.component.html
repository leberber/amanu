<div class="register-carousel" [class.register-carousel--ready]="state.pageReady()" [class.register-carousel--no-animation]="state.stateRestored">

  <!-- Progress Header (hidden on steps 0, 3=map, 6=success, or when input focused) -->
  <div class="progress-header" [class.hidden]="state.activeStep() === 0 || state.activeStep() === 3 || state.activeStep() === 6 || state.isInputFocused()">
    <div class="progress-content">
      @if (state.activeStep() > 0) {
        <button class="back-nav" (click)="prevStep()">
          <i class="pi pi-arrow-left"></i>
        </button>
      }
      <div class="progress-info">
        <div class="step-dots">
          @for (step of stepDots; track step) {
            <span class="dot"
                  [class.active]="state.activeStep() === step"
                  [class.completed]="state.activeStep() > step"
                  [class.accessible]="canAccessStep(step) || step <= state.activeStep()"
                  (click)="goToStep(step)"></span>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Carousel Container -->
  <div class="carousel-container">
    <div class="carousel-track" [style.transform]="'translateX(-' + (state.activeStep() * 100) + '%)'">

      <!-- Step 0: Type Choice / Personal Info -->
      <div class="carousel-slide carousel-slide--step0">
        <div class="register-page" [class.register-page--ready]="state.pageReady()">
          <div class="register-logo">
            <img src="/logo.png" alt="Logo">
          </div>

          <div class="register-content">
            @if (state.registrationType() === null && !state.fromGoogle()) {
              <app-type-choice-step
                (typeSelected)="onTypeSelected($event)" />
            } @else {
              <app-personal-info-step
                (continue)="nextStep()"
                (backToChoice)="onBackToChoice()"
                (googleCredential)="onGoogleCredential($event)" />
            }
          </div>
        </div>
      </div>

      <!-- Step 1: Email Verification -->
      <div class="carousel-slide carousel-slide--modern">
        <div class="register-step">
          <app-email-verification-step
            (verify)="onVerifyCode()"
            (resendCode)="onResendCode()" />
        </div>
      </div>

      <!-- Step 2: Password -->
      <div class="carousel-slide carousel-slide--modern">
        <div class="register-step">
          <app-password-step
            (continue)="nextStep()" />
        </div>
      </div>

      <!-- Step 3: Location Map (Customer only) -->
      <div class="carousel-slide">
        @if (state.activeStep() === 3) {
          <app-location-map-step
            [currentStep]="state.activeStep()"
            [stepDots]="stepDots"
            (back)="prevStep()"
            (confirm)="onConfirmLocation()"
            (locationError)="onLocationError($event)" />
        }
      </div>

      <!-- Step 4: Store Details (Customer) OR Vehicle Details (Driver) -->
      <div class="carousel-slide carousel-slide--modern">
        <div class="register-step">
          @if (state.isDriverMode()) {
            <app-vehicle-details-step
              (continue)="nextStep()" />
          } @else {
            <app-store-details-step
              (continue)="nextStep()" />
          }
        </div>
      </div>

      <!-- Step 5: Confirmation -->
      <div class="carousel-slide carousel-slide--modern">
        <div class="slide-content">
          <app-confirmation-step
            (goToStep)="goToStep($event)" />
        </div>
      </div>

      <!-- Step 6: Success -->
      <div class="carousel-slide">
        <div class="slide-content">
          <app-inactive-user-message
            buttonType="home"
            (buttonClick)="goToHome()" />
        </div>
      </div>

    </div>
  </div>

  <!-- Fixed Footer - Only for step 5 (confirmation) -->
  <div class="fixed-footer" [class.hidden]="state.activeStep() !== 5">
    <button class="register-btn" [disabled]="state.loading()" (click)="onRegister()">
      @if (!state.loading()) {
        <span>{{ state.fromGoogle() ? ('common.save' | translate) : ('auth.register' | translate) }}</span>
      } @else {
        <i class="pi pi-spin pi-spinner"></i>
      }
    </button>
  </div>
</div>
