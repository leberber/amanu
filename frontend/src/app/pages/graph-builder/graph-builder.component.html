<div class="graph-builder" @fadeIn>
  <!-- Top toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <h2 class="title">Road Builder</h2>
      <span class="subtitle">Click on map to add points, then generate route</span>
    </div>

    <div class="toolbar-center">
      <!-- Layer switcher -->
      <p-selectButton
        [options]="layerOptions"
        [ngModel]="selectedLayer()"
        (ngModelChange)="onLayerChange($event)"
        optionLabel="label"
        optionValue="value"
        size="small"
      />
    </div>

    <div class="toolbar-right">
      <!-- Point counter -->
      <span class="point-count">
        {{ points().length }} point{{ points().length !== 1 ? 's' : '' }}
      </span>

      <!-- Clear buttons -->
      <p-button
        icon="pi pi-minus"
        [text]="true"
        severity="secondary"
        (onClick)="removeLastPoint()"
        [disabled]="points().length === 0"
        pTooltip="Remove last point"
      />
      <p-button
        icon="pi pi-trash"
        [text]="true"
        severity="danger"
        (onClick)="clearPoints()"
        [disabled]="points().length === 0"
        pTooltip="Clear all"
      />
    </div>
  </div>

  <!-- Map container -->
  <div id="graph-builder-map" class="map-container"></div>

  <!-- Bottom panel -->
  <div class="bottom-panel">
    <div class="generate-section">
      <p-button
        label="Generate (OSRM)"
        icon="pi pi-directions"
        (onClick)="generateRoute('osrm')"
        [disabled]="points().length < 2 || loading()"
        [loading]="loading()"
        severity="secondary"
      />
      <p-button
        label="Generate (Google)"
        icon="pi pi-google"
        (onClick)="generateRoute('google')"
        [disabled]="points().length < 2 || loading()"
        [loading]="loading()"
      />
    </div>

    @if (currentRoute()) {
      <div class="route-info">
        <span class="route-distance">
          <i class="pi pi-map"></i>
          {{ currentRoute()!.distance_km.toFixed(2) }} km
        </span>
        <span class="route-duration">
          <i class="pi pi-clock"></i>
          {{ currentRoute()!.duration_min.toFixed(0) }} min
        </span>
      </div>

      <div class="save-section">
        <input
          type="text"
          pInputText
          placeholder="Road name..."
          [ngModel]="roadName()"
          (ngModelChange)="roadName.set($event)"
          class="road-name-input"
        />
        <p-button
          label="Save to Database"
          icon="pi pi-save"
          (onClick)="saveRoad()"
          [disabled]="!roadName() || saving()"
          [loading]="saving()"
          severity="success"
        />
      </div>
    }
  </div>
</div>

<p-toast position="top-right" />
