<!-- src/app/pages/forgot-password/forgot-password.component.html -->
<div class="forgot-password-page">
  <p-toast></p-toast>

  <!-- Animated Background -->
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Main Content -->
  <div class="forgot-password-container">
    <div class="forgot-password-content">
      <!-- Header -->
      <div class="forgot-password-header">
        <div class="icon-wrapper">
          <div class="icon-bg"></div>
          <div class="icon-circle">
            <i class="pi pi-lock"></i>
          </div>
        </div>
        <h1>{{ 'auth.forgot_password_title' | translate }}</h1>
        <p>{{ 'auth.forgot_password_subtitle' | translate }}</p>
      </div>

      <!-- Form -->
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
        <!-- Email Field -->
        <div class="fancy-field" data-field="email" [class.focused]="focusedField === 'email'" [class.filled]="forgotPasswordForm.get('email')?.value" (click)="focusField('email')">
          <div class="field-icon">
            <i class="pi pi-envelope"></i>
          </div>
          <div class="field-content">
            <label>{{ 'common.email' | translate }}</label>
            <input
              type="email"
              name="email"
              formControlName="email"
              autocomplete="email"
              [placeholder]="'auth.email_placeholder' | translate"
              (focus)="onInputFocus('email')"
              (blur)="onInputBlur()">
          </div>
        </div>

        <!-- Error message -->
        <small *ngIf="f['email'].touched && f['email'].errors?.['required']" class="field-error">
          {{ 'auth.email_required' | translate }}
        </small>
        <small *ngIf="f['email'].touched && f['email'].errors?.['email']" class="field-error">
          {{ 'auth.email_invalid' | translate }}
        </small>
      </form>

      <!-- Back to Login -->
      <div class="back-link">
        <app-back-button route="/login" label="auth.back_to_login"></app-back-button>
      </div>
    </div>
  </div>

  <!-- Fixed Footer Button -->
  <div class="fixed-footer">
    <button class="fancy-btn" [disabled]="forgotPasswordForm.invalid || loading" (click)="onSubmit()">
      <span *ngIf="!loading">{{ 'auth.send_reset_code' | translate }}</span>
      <div class="btn-icon" *ngIf="!loading">
        <i class="pi pi-send"></i>
      </div>
      <i *ngIf="loading" class="pi pi-spin pi-spinner"></i>
    </button>
  </div>
</div>
