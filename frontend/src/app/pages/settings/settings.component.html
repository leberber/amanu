<app-page-layout
  title="settings.title"
  subtitle="settings.subtitle"
  icon="pi pi-cog"
  [hideMobileIcon]="true"
  [showBackButton]="true"
  [backRoute]="routes.PRODUCTS"
  [fullscreen]="true">

  <div class="settings-page">
    <!-- Preferences Section -->
    <div class="settings-section">
      <div class="settings-section__title">{{ 'settings.preferences' | translate }}</div>
      <div class="settings-card">
        <!-- Language -->
        <div class="settings-item">
          <div class="settings-item__icon">
            <i class="pi pi-globe"></i>
          </div>
          <div class="settings-item__content">
            <span class="settings-item__label">{{ 'settings.language' | translate }}</span>
          </div>
          <div class="settings-item__action">
            <app-language-selector></app-language-selector>
          </div>
        </div>

        <!-- View Mode -->
        <div class="settings-item">
          <div class="settings-item__icon">
            <i class="pi pi-th-large"></i>
          </div>
          <div class="settings-item__content">
            <span class="settings-item__label">{{ 'settings.view_mode' | translate }}</span>
          </div>
          <div class="settings-item__action">
            <div class="view-toggle">
              <button
                class="view-toggle__option"
                [class.active]="currentViewMode() === 'list'"
                (click)="setViewMode('list')">
                <i class="pi pi-list"></i>
              </button>
              <button
                class="view-toggle__option"
                [class.active]="currentViewMode() === 'grid'"
                (click)="setViewMode('grid')">
                <i class="pi pi-th-large"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Push Notifications -->
        <div class="settings-item settings-item--last">
          <div class="settings-item__icon">
            <i class="pi pi-bell"></i>
          </div>
          <div class="settings-item__content">
            <span class="settings-item__label">{{ 'settings.push_notifications' | translate }}</span>
          </div>
          <div class="settings-item__action">
            <p-toggleswitch
              [ngModel]="notificationsEnabled()"
              (onChange)="toggleNotifications()"
              [disabled]="loadingNotifications()">
            </p-toggleswitch>
          </div>
        </div>
      </div>
    </div>

    <!-- App Info Section -->
    <div class="settings-section">
      <div class="settings-section__title">{{ 'settings.app_info' | translate }}</div>
      <div class="settings-card">
        <div class="settings-item">
          <div class="settings-item__icon settings-item__icon--muted">
            <i class="pi pi-tag"></i>
          </div>
          <div class="settings-item__content">
            <span class="settings-item__label">{{ 'settings.version' | translate }}</span>
          </div>
          <div class="settings-item__value">1.0.0</div>
        </div>
        <div class="settings-item settings-item--last">
          <div class="settings-item__icon settings-item__icon--muted">
            <i class="pi pi-code"></i>
          </div>
          <div class="settings-item__content">
            <span class="settings-item__label">{{ 'settings.build' | translate }}</span>
          </div>
          <div class="settings-item__value">2026.03</div>
        </div>
      </div>
    </div>
  </div>
</app-page-layout>
