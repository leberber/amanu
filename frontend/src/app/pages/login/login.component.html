<div class="login-page" [class.login-page--ready]="pageReady()">

  <!-- Logo (animated) -->
  <div class="login-logo">
    <img src="/logo.png" alt="Logo">
  </div>

  <!-- Form Container (fades in) -->
  <div class="login-content">
    <!-- Header -->
    <div class="login-header">
      <h1>{{ 'auth.login_title' | translate }}</h1>
      <p>{{ 'auth.login_subtitle' | translate }}</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="login-input" [class.login-input--focused]="focusedField() === 'username'" [class.login-input--filled]="loginForm.get('username')?.value">
        <input
          #usernameInput
          type="email"
          inputmode="email"
          enterkeyhint="next"
          formControlName="username"
          autocomplete="email"
          autofocus
          [placeholder]="'auth.email_placeholder' | translate"
          (focus)="onInputFocus('username')"
          (blur)="onInputBlur()">
      </div>

      <!-- Password Field -->
      <div class="login-input" [class.login-input--focused]="focusedField() === 'password'" [class.login-input--filled]="loginForm.get('password')?.value">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          enterkeyhint="done"
          formControlName="password"
          autocomplete="current-password"
          [placeholder]="'auth.password_placeholder' | translate"
          (focus)="onInputFocus('password')"
          (blur)="onInputBlur()"
          (keydown.enter)="onSubmit()">
        <button type="button" class="login-input__toggle" (click)="togglePassword()" tabindex="-1">
          <i class="pi" [class.pi-eye]="!showPassword()" [class.pi-eye-slash]="showPassword()"></i>
        </button>
      </div>

      <!-- Links Row -->
      <div class="login-links">
        <a [routerLink]="ROUTES.FORGOT_PASSWORD">{{ 'auth.forgot_password' | translate }}</a>
        <a [routerLink]="ROUTES.REGISTER">{{ 'common.register' | translate }}</a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="login-btn"
        [disabled]="loginForm.invalid || loading()">
        @if (!loading()) {
          <span>{{ 'auth.login' | translate }}</span>
        } @else {
          <i class="pi pi-spin pi-spinner"></i>
        }
      </button>

      <!-- Divider -->
      <div class="login-divider">
        <span>{{ 'common.or' | translate }}</span>
      </div>

      <!-- Google Sign-In Button -->
      <div class="login-google">
        <app-google-signin-button
          #googleButton
          buttonText="signin_with"
          (credentialReceived)="onGoogleCredential($event)"
        />
      </div>
    </form>
  </div>

</div>
