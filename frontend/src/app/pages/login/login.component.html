<!-- src/app/pages/login/login.component.html -->
<div class="login-page">
  <p-toast></p-toast>

  <!-- Animated Background -->
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Main Content -->
  <div class="login-container">
    <div class="login-content">
      <!-- Header -->
      <div class="login-header">
        <div class="icon-wrapper">
          <div class="icon-bg"></div>
          <div class="icon-circle">
            <i class="pi pi-sign-in"></i>
          </div>
        </div>
        <h1>{{ 'auth.login_title' | translate }}</h1>
        <p>{{ 'auth.login_subtitle' | translate }}</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email Field -->
        <div class="fancy-field" data-field="username" [class.focused]="focusedField === 'username'" [class.filled]="loginForm.get('username')?.value" (click)="focusField('username')">
          <div class="field-icon">
            <i class="pi pi-envelope"></i>
          </div>
          <div class="field-content">
            <label>{{ 'common.email' | translate }}</label>
            <input
              #usernameInput
              type="email"
              formControlName="username"
              [placeholder]="'auth.email_placeholder' | translate"
              (focus)="onInputFocus('username')"
              (blur)="onInputBlur()">
          </div>
        </div>

        <!-- Password Field -->
        <div class="fancy-field password-field" data-field="password" [class.focused]="focusedField === 'password'" [class.filled]="loginForm.get('password')?.value" (click)="focusField('password')">
          <div class="field-icon">
            <i class="pi pi-lock"></i>
          </div>
          <div class="field-content">
            <label>{{ 'common.password' | translate }}</label>
            <p-password
              formControlName="password"
              [placeholder]="'auth.password_placeholder' | translate"
              [toggleMask]="true"
              [feedback]="false"
              styleClass="fancy-password"
              (onFocus)="onInputFocus('password')"
              (onBlur)="onInputBlur()">
            </p-password>
          </div>
        </div>

        <!-- Forgot Password Link -->
        <div class="forgot-password">
          <a href="#" (click)="onForgotPassword($event)">
            {{ 'auth.forgot_password' | translate }}
          </a>
        </div>
      </form>

      <!-- Register Link -->
      <div class="register-link">
        <span>{{ 'auth.no_account' | translate }}</span>
        <a routerLink="/register">
          {{ 'auth.register_now' | translate }}
          <i class="pi pi-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Fixed Footer Button -->
  <div class="fixed-footer">
    <button class="fancy-btn" [disabled]="loginForm.invalid || loading" (click)="onSubmit()">
      <span *ngIf="!loading">{{ 'auth.login' | translate }}</span>
      <div class="btn-icon" *ngIf="!loading">
        <i class="pi pi-sign-in"></i>
      </div>
      <i *ngIf="loading" class="pi pi-spin pi-spinner"></i>
    </button>
  </div>

  <!-- Inactive Account Modal -->
  <p-dialog
    [(visible)]="showInactiveModal"
    [modal]="true"
    [closable]="false"
    [closeOnEscape]="false"
    [draggable]="false"
    [resizable]="false"
    [style]="{width: '90vw', maxWidth: '400px'}"
    styleClass="inactive-account-dialog"
  >
    <ng-template pTemplate="header">
      <span class="text-xl font-semibold">{{ 'auth.account_inactive_title' | translate }}</span>
    </ng-template>

    <div class="inactive-modal-content">
      <div class="inactive-icon">
        <i class="pi pi-info-circle"></i>
      </div>
      <p>{{ 'auth.account_inactive' | translate }}</p>
    </div>

    <ng-template pTemplate="footer">
      <button class="fancy-btn secondary" (click)="showInactiveModal = false; router.navigate(['/'])">
        <span>{{ 'common.close' | translate }}</span>
      </button>
    </ng-template>
  </p-dialog>
</div>
